<!DOCTYPE html>
<html>
<head>
    <title>Rule Based Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="chat-container">

    <h1>🤖 Rule-Based Chatbot</h1>

    <div id="chat-box"></div>

    <input type="text"
           id="user-input"
           placeholder="Type a message">

    <button onclick="sendMessage()">
        Send
    </button>

</div>

<script>

async function sendMessage() {

    let input =
    document.getElementById("user-input");

    let message =
    input.value;

    if(message === "") return;

    let chatBox =
    document.getElementById("chat-box");

    chatBox.innerHTML +=
    "<p><b>You:</b> " + message + "</p>";

    const response =
    await fetch("/get_response", {

        method: "POST",

        headers: {
            "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
            message: message
        })
    });

    const data =
    await response.json();

    chatBox.innerHTML +=
    "<p><b>Bot:</b> " +
    data.response +
    "</p>";

    input.value = "";

}

</script>

</body>
</html>
